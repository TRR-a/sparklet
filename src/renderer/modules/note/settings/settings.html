<!DOCTYPE html>
<html>
<head>
    <!-- 页面元数据 -->
    <meta charset="utf-8">
    <title>Sparklet 设置</title>
    <!-- 引入设置页面样式 -->
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <!-- 设置窗口：提供语言设置、关于信息等功能 -->
    <div class="settings-window">
        <!-- 窗口标题栏 -->
        <div class="title-bar">
            <div class="window-controls">
                <button class="window-btn minimize" data-i18n-title="tooltip.minimize" title="最小化">−</button>
                <button class="window-btn close" data-i18n-title="tooltip.close" title="关闭">×</button>
            </div>
            <h2 class="window-title" data-i18n="settings.title">设置</h2>
        </div>

        <!-- 设置内容区 -->
        <div class="settings-content">
            <!-- 语言设置部分 -->
            <div class="settings-section">
                <h3 data-i18n="settings.language">语言</h3>
                <div class="setting-item">
                    <label for="languageSelect" data-i18n="settings.interfaceLanguage">界面语言：</label>
                    <select id="languageSelect" class="language-select">
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt-BR">Português (Brasil)</option>
                        <option value="ru">Русский</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                    </select>
                </div>
            </div>

            <!-- 工具按钮部分 -->
            <div class="settings-section">
                <h3 data-i18n="settings.tools">工具</h3>
                <div class="button-group">
                    <button id="openAboutBtn" class="settings-btn" data-i18n="settings.about">关于 Sparklet</button>
                    <button id="openDevToolsBtn" class="settings-btn" data-i18n="settings.devTools">开发者工具</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置页脚本 -->
    <script type="module" src="settings.js"></script>
</body>
</html>
