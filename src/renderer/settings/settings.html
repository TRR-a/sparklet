<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sparklet 设置</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="settings-window">
        <!-- 标题栏（最小化、关闭） -->
        <div class="title-bar">
            <div class="window-controls">
                <button class="window-btn minimize" title="最小化">−</button>
                <button class="window-btn close" title="关闭">×</button>
            </div>
            <h2 class="window-title">设置</h2>
        </div>

        <!-- 设置内容区域 -->
        <div class="settings-content">
            <!-- 关于我们独立窗口（预留） -->
            <div class="settings-section">
                <h3>关于 Sparklet</h3>
                <p><strong>版本</strong> 0.2.1</p>
                <p>一个轻量的桌面笔记工具</p>
                <p>© 2026 TRR-a</p>
            </div>

            <!-- 调试按钮独立窗口（预留） -->
            <div class="settings-section">
                <h3>调试</h3>
                <button id="openDevToolsBtn" class="settings-btn">打开开发者工具</button>
            </div>
        </div>
    </div>
    <script src="settings.js"></script>
</body>
</html>
