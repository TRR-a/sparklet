<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sparklet Settings</title>
    <link rel="stylesheet" href="kernel-settings.css">
</head>
<body>
    <div class="settings-window">
        <!-- Title bar [标题栏：红绿灯 + 可拖拽] -->
        <div class="title-bar">
            <div class="window-controls">
                <button class="window-btn minimize" id="minimizeBtn" data-tooltip="Minimize">−</button>
                <button class="window-btn close" id="closeBtn" data-tooltip="Close">×</button>
            </div>
            <h2 class="window-title" data-i18n="kernel.settingsTitle">Kernel Settings</h2>
        </div>

        <div class="settings-content">
            <!-- Appearance [外观：主题] -->
            <div class="settings-section">
                <h3 data-i18n="kernel.settingsTheme">Theme</h3>
                <div class="setting-item">
                    <div class="custom-select" id="themeSelect" data-value="light">
                        <button class="custom-select-trigger" type="button">
                            <span class="custom-select-label" data-i18n="kernel.themeLight">Light</span>
                            <svg class="custom-select-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="custom-select-dropdown">
                            <div class="custom-select-option selected" data-value="light" data-i18n="kernel.themeLight">Light</div>
                            <div class="custom-select-option" data-value="dark" data-i18n="kernel.themeDark">Dark</div>
                            <div class="custom-select-option" data-value="blue" data-i18n="kernel.themeBlue">Blue</div>
                        </div>
                    </div>
                </div>
                <div class="setting-item switch-item">
                    <label for="clock12hToggle" data-i18n="kernel.use12HourClock">Use 12-hour clock</label>
                    <label class="switch">
                        <input type="checkbox" id="clock12hToggle" role="switch">
                        <span class="switch-slider"></span>
                    </label>
                </div>
            </div>

            <!-- Language [语言] -->
            <div class="settings-section">
                <h3 data-i18n="kernel.settingsLanguage">Language</h3>
                <div class="setting-item">
                    <div class="custom-select" id="languageSelect" data-value="en">
                        <button class="custom-select-trigger" type="button">
                            <span class="custom-select-label">English</span>
                            <svg class="custom-select-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="custom-select-dropdown">
                            <div class="custom-select-option selected" data-value="en">English</div>
                            <div class="custom-select-option" data-value="zh-CN">简体中文</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- About [关于] -->
            <div class="settings-section">
                <h3 data-i18n="kernel.about">About</h3>
                <div class="about-info">
                    <div class="about-row"><span>Sparklet</span><span id="appVersion">—</span></div>
                    <div class="about-row"><span>Electron</span><span id="electronVersion">—</span></div>
                    <div class="about-row"><span>Node.js</span><span id="nodeVersion">—</span></div>
                    <div class="about-row"><span>Chromium</span><span id="chromeVersion">—</span></div>
                </div>
            </div>

            <!-- Tools [工具] -->
            <div class="settings-section">
                <h3 data-i18n="kernel.tools">Tools</h3>
                <div class="button-group">
                    <button id="openOfficialSiteBtn" class="settings-btn" data-i18n="kernel.openOfficialSite">Official Site</button>
                    <button id="openDevToolsBtn" class="settings-btn" data-i18n="kernel.devTools">DevTools</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="kernel-settings.js"></script>
</body>
</html>
