<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparklet</title>
    <link rel="stylesheet" href="../core/fonts/fonts.css">
    <link rel="stylesheet" href="kernel.css">
</head>
<body>
    <!-- 标题栏：位于外壳顶部 padding 区域 -->
    <div class="title-bar">
        <div class="title-row title-row-top">
            <div class="shell-left-wrap">
                <button id="shellDropdownBtn" class="shell-dropdown-btn" data-tooltip="菜单" aria-label="菜单">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="shell-tabs" id="shellTabs">
                    <div class="shell-tab active" data-tab-id="0">
                        <span class="shell-tab-title">New Tab</span>
                        <button class="shell-tab-close" aria-label="Close tab">×</button>
                    </div>
                    <button class="shell-tab-add" id="shellTabAdd" aria-label="New tab">+</button>
                </div>
            </div>
            <div class="window-controls">
                <button id="windowPinBtn" class="window-btn pin" data-tooltip="窗口置顶">📌</button>
                <button class="window-btn minimize" data-tooltip="最小化">−</button>
                <button class="window-btn maximize" data-tooltip="最大化">□</button>
                <button class="window-btn close" data-tooltip="关闭">×</button>
            </div>
        </div>
        <div class="title-row title-row-bottom">
            <div class="shell-more-wrap">
                <button id="shellMoreBtn" class="shell-more-btn" data-tooltip="更多" aria-label="更多">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
                </button>
                <div id="shellMoreMenu" class="shell-more-menu" style="display: none;">
                    <button class="shell-more-item" data-action="settings" data-i18n="kernel.settings">Settings</button>
                </div>
            </div>
        </div>
    </div>
    <div class="kernel-shell">
        <!-- 右侧内容列 -->
        <div class="kernel-content">
            <main class="kernel-main view" id="viewHome">
                <div class="swiss-layout">
                    <!-- 第一段：Sparklet 标题 -->
                    <section class="swiss-section swiss-section-1">
                        <h1 class="swiss-title">Sparklet:</h1>
                        <p class="swiss-subtitle">Welcome User!</p>
                    </section>
                    <!-- 第二段（待实现） -->
                    <section class="swiss-section swiss-section-2"></section>
                    <!-- 第三段（待实现） -->
                    <section class="swiss-section swiss-section-3"></section>
                </div>
            </main>
        </div>

        <!-- 标签页内容区：嵌入插件 webview -->
        <div id="tabView" style="display:none; flex:1; position:relative; overflow:hidden;">
        </div>
    </div>

    <!-- Exit confirm (double-Esc) -->
    <div id="kernelExitModal" class="kernel-exit-overlay" style="display: none;">
        <div class="kernel-exit-box">
            <div class="kernel-exit-title" data-i18n="kernel.exitTitle">Quit Sparklet?</div>
            <div class="kernel-exit-message" data-i18n="kernel.exitMessage">Are you sure you want to quit?</div>
            <div class="kernel-exit-buttons">
                <button id="kernelExitReturnBtn" class="kernel-exit-btn return focused" data-i18n="kernel.exitReturn">Return</button>
                <button id="kernelExitQuitBtn" class="kernel-exit-btn quit" data-i18n="kernel.exitQuit">Quit</button>
            </div>
        </div>
    </div>

    <script type="module" src="./kernel.js"></script>
</body>
</html>
