<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SparkLet</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- 标题栏（任务四：自定义窗口控制按钮） -->
    <div class="header">
        <!-- 左侧：窗口控制按钮组（最小化、最大化、关闭） -->
        <div class="window-controls">
            <button class="window-btn minimize" title="最小化">−</button>
            <button class="window-btn maximize" title="最大化">□</button>
            <button class="window-btn close" title="关闭">×</button>
        </div>
        <!-- 中间/右侧：功能按钮（回收站、设置、主题） -->
        <div class="header-controls">
            <button id="trashToggle" class="trash-toggle-btn" title="回收站">🗑️</button>
            <button id="settingsBtn" class="trash-toggle-btn" title="设置">⚙️</button>
            <button id="themeToggle" class="theme-toggle" aria-label="切换主题"></button>
        </div>
        <!-- 任务五：标题移动到最右边 -->
        <div class="header-title">
            <h2>SparkLet</h2>
        </div>
    </div>
    
    <!-- 主内容区：两栏布局（保持不变） -->
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="newNoteBtn" class="new-note-btn">+ 新建笔记</button>
            </div>
            <ul id="noteList" class="note-list">
                <!-- 笔记列表动态生成 -->
            </ul>
        </div>

        <div class="editor">
            <div class="color-palette">
                <button class="color-option active" data-color="#4285f4" style="background-color:#4285f4;"></button>
                <button class="color-option" data-color="#ea4335" style="background-color:#ea4335;"></button>
                <button class="color-option" data-color="#fbbc04" style="background-color:#fbbc04;"></button>
                <button class="color-option" data-color="#34a853" style="background-color:#34a853;"></button>
                <button class="color-option" data-color="#8b5cf6" style="background-color:#8b5cf6;"></button>
            </div>
            <input type="text" id="noteTitle" class="note-title-input" placeholder="笔记标题...">
            <textarea id="noteArea" class="note-editor" placeholder="记录您的灵感..."></textarea>
        </div>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
