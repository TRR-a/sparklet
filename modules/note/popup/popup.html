<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 页面语言与字符集 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparklet</title>
    <!-- 引入弹窗样式 -->
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="note-list.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="dialogs.css">
</head>
<body>
    <!-- 标题栏：包含窗口控制、应用名称、工具按钮 -->
    <div class="title-bar">
        <!-- 第一行：窗口最小化/最大化/关闭按钮 + 应用标题 -->
        <div class="title-row title-row-top">
            <div class="window-controls">
                <button id="windowPinBtn" class="window-btn pin" data-i18n-title="tooltip.windowPin" title="窗口置顶">📌</button>
                <button class="window-btn minimize" data-i18n-title="tooltip.minimize" title="最小化">−</button>
                <button class="window-btn maximize" data-i18n-title="tooltip.maximize" title="最大化">□</button>
                <button class="window-btn close" data-i18n-title="tooltip.close" title="关闭">×</button>
            </div>
            <h1 class="app-title" data-i18n="app.name">Sparklet</h1>
        </div>
        <!-- 第二行：回收站、设置按钮 -->
        <div class="title-row title-row-bottom">
            <div class="action-buttons">
                <button id="trashToggle" class="icon-btn" data-i18n-title="tooltip.trash" title="回收站">🗑️</button>
                <button id="settingsBtn" class="icon-btn" data-i18n-title="tooltip.settings" title="设置">⚙️</button>
            </div>
        </div>
    </div>
    
    <!-- 主内容区：左侧笔记列表，右侧编辑区 -->
    <div class="main-container">
        <!-- 侧边栏：笔记列表 + 项目工作区 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="newNoteBtn" class="new-note-btn" data-i18n="main.newNote">+ 新建笔记</button>
            </div>
            <ul id="noteList" class="note-list"></ul>
            <div class="project-section">
                <div class="project-group-header">
                    <span class="project-group-title">项目</span>
                    <button id="openFolderBtn" class="project-add-btn" title="打开文件夹">+</button>
                </div>
                <ul id="projectFileTree" class="project-file-tree"></ul>
            </div>
        </div>
        <!-- 编辑区：颜色选择、标题输入、内容编辑、文件预览 -->
        <div class="editor">
            <div class="color-palette">
                <button class="color-option active" data-color="#4285f4" style="background-color:#4285f4;"></button>
                <button class="color-option" data-color="#ea4335" style="background-color:#ea4335;"></button>
                <button class="color-option" data-color="#fbbc04" style="background-color:#fbbc04;"></button>
                <button class="color-option" data-color="#34a853" style="background-color:#34a853;"></button>
                <button class="color-option" data-color="#8b5cf6" style="background-color:#8b5cf6;"></button>
            </div>
            <input type="text" id="noteTitle" class="note-title-input" data-i18n-placeholder="main.noteTitlePlaceholder" placeholder="笔记标题...">
            <div class="editor-toolbar">
                <button id="previewToggleBtn" class="preview-toggle-btn" title="切换预览">👁️ 预览</button>
            </div>
            <textarea id="noteArea" class="note-editor" data-i18n-placeholder="main.noteContentPlaceholder" placeholder="记录您的灵感..."></textarea>
            <div id="notePreview" class="note-preview" style="display: none;"></div>
            <!-- 文件预览区域 [File preview area] -->
            <div id="filePreview" class="file-preview" style="display: none;">
                <div class="file-preview-header">
                    <span id="filePreviewName" class="file-preview-name"></span>
                    <button id="filePreviewClose" class="file-preview-close" title="关闭">×</button>
                </div>
                <div id="filePreviewContent" class="file-preview-content"></div>
            </div>
        </div>
    </div>

    <!-- 设置窗口光晕遮罩层：用于视觉效果与位置同步 -->
    <div id="settingsGlowMask" class="settings-glow-mask"></div>

    <!-- 自定义确认弹窗（替换系统原生 confirm，避免 Electron 焦点丢失问题）-->
    <div id="customConfirmModal" class="custom-confirm-overlay" style="display: none;">
        <div class="custom-confirm-box">
            <div class="custom-confirm-title" id="confirmTitle">确认</div>
            <div class="custom-confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
            <div class="custom-confirm-buttons">
                <button id="confirmCancelBtn" class="custom-confirm-btn cancel">取消</button>
                <button id="confirmOkBtn" class="custom-confirm-btn ok">确定</button>
            </div>
        </div>
    </div>

    <!-- 笔记详细信息弹窗 -->
    <div id="noteInfoModal" class="custom-confirm-overlay" style="display: none;">
        <div class="custom-confirm-box note-info-box">
            <div class="custom-confirm-title" data-i18n="noteInfo.title">详细信息</div>
            <div id="noteInfoBody" class="note-info-body"></div>
            <div class="custom-confirm-buttons">
                <button id="noteInfoCloseBtn" class="custom-confirm-btn ok" data-i18n="noteInfo.close">关闭</button>
            </div>
        </div>
    </div>

    <!-- 退出确认弹窗（双击 Esc 唤起，玻璃拟态，键盘导航：←/→ 切换、Enter 确认、Esc 返回） -->
    <div id="exitConfirmModal" class="exit-confirm-overlay" style="display: none;">
        <div class="exit-confirm-box">
            <div class="exit-confirm-title" data-i18n="dialog.exitConfirm.title">退出 Sparklet</div>
            <div class="exit-confirm-message" data-i18n="dialog.exitConfirm.message">退出前将自动保存未保存的内容，确定要退出吗？</div>
            <div class="exit-confirm-buttons">
                <button id="exitReturnBtn" class="exit-confirm-btn return focused" data-i18n="dialog.exitConfirm.btnReturn">返回</button>
                <button id="exitQuitBtn" class="exit-confirm-btn quit" data-i18n="dialog.exitConfirm.btnQuit">退出</button>
            </div>
        </div>
    </div>

    <!-- 主弹窗逻辑脚本 -->
    <script type="module" src="../Pages/popup/popup.js"></script>
</body>
</html>
